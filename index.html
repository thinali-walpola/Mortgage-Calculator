<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mortgage Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- LEFT SIDE FORM -->
  <div class="form-box">
    <h2>Mortgage Calculator</h2>
    <a href="#" id="clearBtn">Clear All</a>

    <!-- Mortgage Amount -->
    <label>Mortgage Amount</label>
    <div class="input-box">
      <span class="prefix">£</span>
      <input type="number" id="amount">
    </div>
    <small class="error" id="amountError"></small>

    <!-- Mortgage Term -->
    <label>Mortgage Term</label>
    <div class="input-box">
      <input type="number" id="years">
      <span class="suffix">years</span>
    </div>
    <small class="error" id="yearsError"></small>

    <!-- Interest Rate -->
    <label>Interest Rate</label>
    <div class="input-box">
      <input type="number" id="rate" step="0.01">
      <span class="suffix">%</span>
    </div>
    <small class="error" id="rateError"></small>

    <!-- Mortgage Type -->
    <label>Mortgage Type</label>
    <div class="radio-box">
      <label>
        <input type="radio" name="type" value="repayment" checked>
        Repayment
      </label>

      <label>
        <input type="radio" name="type" value="interest">
        Interest Only
      </label>
    </div>
    <small class="error" id="typeError"></small>

    <!-- Button -->
    <button id="calculateBtn">Calculate Repayments</button>
  </div>

  <!-- RIGHT SIDE RESULTS -->
  <div class="result-box" id="resultBox">
    <h2>Results shown here</h2>
    <p>Complete the form and click "calculate repayments" to see results.</p>

    <div id="results" class="hidden">
      <h3>Your monthly repayments</h3>
      <div class="big-result" id="monthly"></div>

      <h4>Total you'll repay over the term</h4>
      <div class="small-result" id="total"></div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
